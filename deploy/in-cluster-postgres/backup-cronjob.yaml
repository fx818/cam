apiVersion: batch/v1
kind: CronJob
metadata:
  name: cam-postgres-backup
  namespace: cam
  labels:
    app.kubernetes.io/name: cam
spec:
  schedule: "30 17 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              # Pinned by digest for reproducibility (R37).
              image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
              command:
                - sh
                - -c
                - |
                  set -eu
                  # Database name must be a bare identifier (R31): the previous
                  # "/cam" was read by pg_dump as a file path and the dump failed.
                  pg_dump -h cam-postgres -U cam -Fc --no-owner -f "/backups/cam-$(date +%Y%m%d).dump" -d cam
                  ls -la /backups
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cam-postgres
                      key: password
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: cam-postgres-backups
