apiVersion: batch/v1
kind: CronJob
metadata:
  name: cam-postgres-backup
  namespace: cam
  labels:
    app.kubernetes.io/name: cam
spec:
  schedule: "30 17 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              command:
                - sh
                - -c
                - set -eu; pg_dump -h cam-postgres -U cam -Fc -f /backups/cam-$(date +%Y%m%d).dump
                  /cam && ls -la /backups
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cam-postgres
                      key: password
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: cam-postgres-backups
