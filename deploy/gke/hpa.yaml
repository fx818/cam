apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cam
  namespace: cam
  labels:
    app.kubernetes.io/name: cam
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cam
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
