apiVersion: apps/v1
kind: Deployment
metadata:
  name: cam
  namespace: cam
  labels:
    app.kubernetes.io/name: cam
spec:
  # Single replica until sessions/rate-limits/job-schedulers move out of process
  # memory (R15). See hpa.yaml.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cam
    spec:
      serviceAccountName: cam
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cam
          image: REGION-docker.pkg.dev/PROJECT/REPO/cam:SET_TAG_AT_DEPLOY
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cam-config
          env:
            - name: CAM_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: cam-secrets
                  key: CAM_ENCRYPTION_KEYS
            - name: CAM_ENCRYPTION_KEY_CURRENT
              valueFrom:
                secretKeyRef:
                  name: cam-secrets
                  key: CAM_ENCRYPTION_KEY_CURRENT
            - name: CAM_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: cam-secrets
                  key: CAM_SESSION_SECRET
            - name: CAM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cam-db
                  key: CAM_DATABASE_URL
          # Non-root, no privilege escalation, no Linux capabilities (R29). The
          # image already runs as uid 10001; these pin it at the cluster level.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
        - name: cloud-sql-proxy
          image: us-docker.pkg.dev/cloud-sql-containers/cloud-sql-proxy:2.11.4
          args:
            - "--private-ip"
            - "$(CLOUD_SQL_INSTANCE)"
          env:
            - name: CLOUD_SQL_INSTANCE
              value: "PROJECT:REGION:REPLACE_INSTANCE_NAME"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
