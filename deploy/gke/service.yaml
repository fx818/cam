apiVersion: v1
kind: Service
metadata:
  name: cam
  namespace: cam
  labels:
    app.kubernetes.io/name: cam
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cam
  ports:
    - name: http
      port: 80
      targetPort: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 43200
