name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned by digest for reproducibility (see R37).
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: cam
          POSTGRES_PASSWORD: cam
          POSTGRES_DB: cam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cam -d cam"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      # Actions pinned to commit SHAs (R37). The trailing comment is the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check
      - name: ruff format
        run: uv run ruff format --check
      - name: pyright
        run: uv run pyright
      - name: pytest (with coverage gate)
        # Gate calibrated to the measured branch coverage (84.5%); the -4 point
        # floor catches regressions without tripping on environment jitter.
        run: uv run pytest --cov=src/cam --cov-report=term-missing --cov-fail-under=84
        env:
          CAM_TEST_DATABASE_URL: postgresql+asyncpg://cam:cam@localhost:5432/cam_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check (tsc)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build
