services:
  db:
    # Pinned by digest for reproducibility (R37).
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: cam
      POSTGRES_PASSWORD: cam
      POSTGRES_DB: cam
    ports:
      # Bind to loopback only (R29): the DB must never be reachable from the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cam -d cam"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot migration runner (R30). The app image no longer runs migrations at
  # start; this service applies them once and exits before the app starts.
  migrate:
    build: .
    image: cam-app
    command: ["sh", "-c", "uv run --no-sync alembic upgrade head"]
    environment:
      CAM_ENV: ${CAM_ENV:-dev}
      CAM_DATABASE_URL: ${CAM_DATABASE_URL:-postgresql+asyncpg://cam:cam@db:5432/cam}
      CAM_ENCRYPTION_KEYS: ${CAM_ENCRYPTION_KEYS}
      CAM_ENCRYPTION_KEY_CURRENT: ${CAM_ENCRYPTION_KEY_CURRENT:-v1}
      CAM_SESSION_SECRET: ${CAM_SESSION_SECRET}
      CAM_JOBS_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: cam-app
    ports:
      - "8001:8000"
    environment:
      CAM_ENV: ${CAM_ENV:-dev}
      CAM_DATABASE_URL: ${CAM_DATABASE_URL:-postgresql+asyncpg://cam:cam@db:5432/cam}
      CAM_ENCRYPTION_KEYS: ${CAM_ENCRYPTION_KEYS}
      CAM_ENCRYPTION_KEY_CURRENT: ${CAM_ENCRYPTION_KEY_CURRENT:-v1}
      CAM_SESSION_SECRET: ${CAM_SESSION_SECRET}
      CAM_BASE_URL: ${CAM_BASE_URL:-http://localhost:8001}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
