services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cam
      POSTGRES_PASSWORD: cam
      POSTGRES_DB: cam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cam -d cam"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      CAM_ENV: dev
      CAM_DATABASE_URL: postgresql+asyncpg://cam:cam@db:5432/cam
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
