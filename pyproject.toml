[project]
name = "cam"
version = "0.0.1"
description = "Central Agent Management — internal MCP hub"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30",
    "authlib>=1.8.0",
    "click>=8.5.0",
    "cryptography>=50.0.1",
    "fastapi>=0.115",
    # Transport stack imported directly by cam.upstream.pinning (IP pinning);
    # declared explicitly so a transitive change in mcp/httpx cannot remove it.
    "httpcore>=1.0.9",
    "httpcore2>=2.13.1",
    "httpx>=0.27",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2.0",
    "jsonschema>=4.26.0",
    "mcp>=2.2.0",
    "openapi-spec-validator>=0.9.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
    # Imported directly by cam.invoke.validation (explicit local-only registry
    # used to block external $ref network/file retrieval — R01).
    "referencing>=0.37",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
cam = "cam.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.394",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cam"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests", "alembic"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
branch = true
source = ["src/cam"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
